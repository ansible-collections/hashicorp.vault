---
- name: Integration tests for lookup plugin kv1_secret_get
  module_defaults:
    group/hashicorp.vault.vault:
      url: "{{ vault_url }}"
      namespace: "{{ vault_namespace }}"
      auth_method: "token"
      token: "{{ vault_token_from_setup_auth_token }}"
      engine_mount_point: "{{ secret_mount_path }}"
  vars:
    test_secret_path: "ansible-test-secret-{{ vault_resource_suffix }}"
    secret_data:
      test_resource_prefix: "{{ vault_resource_suffix }}"
      hello: world
  block:
    - name: Create test secret
      hashicorp.vault.kv1_secret:
        path: "{{ test_secret_path }}"
        data: "{{ secret_data }}"
        state: present
      register: create_secret

    - name: Read the secret data
      ansible.builtin.set_fact:
        secret_response: "{{ lookup('hashicorp.vault.kv1_secret_get',
          auth_method='token',
          token=vault_token_from_setup_auth_token,
          secret=test_secret_path,
          secret_mount_path=secret_mount_path,
          namespace=vault_namespace,
          url=vault_url) }}"

    - name: Validate lookup response
      ansible.builtin.assert:
        that:
          - secret_response == secret_data

  always:
    - name: Delete test secret
      hashicorp.vault.kv1_secret:
        path: "{{ test_secret_path }}"
        state: absent
      when: create_secret is successful

# Test environment variable support - separate play with play-level environment
- name: Test environment variable support for lookup plugins
  environment:
    VAULT_NAMESPACE: "{{ vault_namespace }}"
    VAULT_AUTH_METHOD: "token"
    VAULT_ENGINE_MOUNT_POINT: "{{ secret_mount_path }}"
    VAULT_TOKEN: "{{ vault_token_from_setup_auth_token }}"
    VAULT_ADDR: "{{ vault_url }}"
  vars:
    test_secret_path: "ansible-test-secret-{{ vault_resource_suffix }}"
    secret_data:
      test_resource_prefix: "{{ vault_resource_suffix }}"
      hello: world
  block:
    - name: Read secret using environment variables only
      ansible.builtin.set_fact:
        secret_from_env: "{{ lookup('hashicorp.vault.kv1_secret_get',
          secret=test_secret_path) }}"

    - name: Verify secret was retrieved using only env vars
      ansible.builtin.assert:
        that:
          - secret_from_env == secret_data

# Test that explicit parameters override environment variables
- name: Test explicit parameters override environment variables
  environment:
    VAULT_ENGINE_MOUNT_POINT: "wrong-mount"
    VAULT_NAMESPACE: "wrong-namespace"
    VAULT_AUTH_METHOD: "approle"
    VAULT_ADDR: "https://wrong.example.com:8200"
  vars:
    test_secret_path: "ansible-test-secret-{{ vault_resource_suffix }}"
    secret_data:
      test_resource_prefix: "{{ vault_resource_suffix }}"
      hello: world
  block:
    - name: Read secret with explicit params overriding wrong env vars
      ansible.builtin.set_fact:
        secret_explicit: "{{ lookup('hashicorp.vault.kv1_secret_get',
          auth_method='token',
          token=vault_token_from_setup_auth_token,
          secret=test_secret_path,
          engine_mount_point=secret_mount_path,
          namespace=vault_namespace,
          url=vault_url) }}"

    - name: Verify explicit params took precedence over env vars
      ansible.builtin.assert:
        that:
          - secret_explicit == secret_data
